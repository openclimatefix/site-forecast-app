# Blend configuration
# Values here drive blend/weights.py and blend/app.py.
blends:
  - client_name: nl
    # ------------------------------------------------------------------ #
    # Model registry                                                       #
    # ------------------------------------------------------------------ #

    # Candidate models for the national blend.
    # The one with the longest delay-adjusted horizon is the backup.
    # The optimiser will pick the single best other one to blend against it.
    day_ahead_candidate_models:
      - nl_regional_da_ecmwf_mo
      - nl_regional_da_ecmwf
      - nl_regional_da_mo

    intraday_candidate_models: 
      - nl_regional_intra_ecmwf_mo_sat_pv
      - nl_regional_intra_ecmwf_mo_sat
      - nl_regional_intra_ecmwf_mo_pv
      - nl_regional_intra_ecmwf_sat_pv


    # Candidate models for regional blends (subset of national candidates).
    regional_candidate_models:
      - nl_regional_intra_ecmwf_mo_sat_pv
      - nl_regional_intra_ecmwf_mo_sat
      - nl_regional_intra_ecmwf_mo_pv
      - nl_regional_intra_ecmwf_sat_pv

    # ------------------------------------------------------------------ #
    # Blending parameters                                                  #
    # ------------------------------------------------------------------ #

    # Taper kernel: weights at the transition zone between two models.
    # Values must be strictly between 0 and 1 and non-increasing.
    blend_kernel:
      - 0.75
      - 0.5
      - 0.25

    # Minimum forecast horizon (minutes) emitted in any blended forecast.
    min_forecast_horizon_minutes: 15

    # Frequency used to floor the blend reference time (t0).
    t0_frequency: 15min

    # ------------------------------------------------------------------ #
    # Adjuster                                                             #
    # ------------------------------------------------------------------ #
    use_adjuster: true

    # ------------------------------------------------------------------ #
    # Infrastructure / naming                                              #
    # ------------------------------------------------------------------ #

    # Path to the MAE scorecard, relative to the blend package directory.
    scorecard_path: data/nl_backtest_nmae_comparison.csv

    # Forecaster name written to the Data Platform.
    forecaster_name: nl_blend_uncurtailed

    # The location name key that identifies the national location in the DP location map.
    national_location_key: nl_national

    # The location type constraint used to filter regional locations from the map.
    regional_location_type: STATE

  - client_name: de
    # de_pv_only excluded: only wins below 1h, and crashes when generation lags t0.
    day_ahead_candidate_models:
      - de_ecmwf_only
      - de_ecmwf_pv
      - de_ecmwf_pv_mo_sat
      - de_mo_only
      - de_sat_only

    # Candidate models for the intraday blend.
    intraday_candidate_models:
      - de_ecmwf_pv_mo_sat_intraday
      - de_ecmwf_pv_intraday

    regional_candidate_models:
      - de_ecmwf_only
      - de_ecmwf_pv
      - de_ecmwf_pv_mo_sat
      - de_mo_only
      - de_sat_only

    blend_kernel:
      - 0.75
      - 0.5
      - 0.25

    min_forecast_horizon_minutes: 15
    t0_frequency: 15min

    use_adjuster: true

    scorecard_path: data/de_nmae_comparison_with_intraday.csv
    forecaster_name: de_blend
    national_location_key: de_national
    regional_location_type: STATE

